[package]
name = "alertmanager-ntfy-adapter"
version = "0.1.0"
edition = "2021"
description = "High-performance webhook adapter bridging Prometheus Alertmanager alerts to ntfy push notifications"
authors = ["nikmosi <i@nikmosi.ru>"]
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
