[tool.bumpversion]
current_version = "0.1.1"
commit = true
message = "chore: bump version {current_version} → {new_version}"
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = 'name = "alertmanager-ntfy-adapter"\nversion = "{current_version}"'
replace = 'name = "alertmanager-ntfy-adapter"\nversion = "{new_version}"'
